[project]
name = "workspace"
version = "0.1.0"
description = "Try out and compare vision and audio models for the PREN dog robot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-contrib-python",  # same cv2 flavour mediapipe uses, avoids duplicate cv2 installs
    "sounddevice",
    "soundfile",
]

# One extra per model family, so you only install what you are testing:
#   uv sync --extra mediapipe --extra vosk
[project.optional-dependencies]
mediapipe = ["mediapipe"]
yolo = ["ultralytics"]
vosk = ["vosk"]
whisper = ["faster-whisper"]
openwakeword = ["openwakeword"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]
