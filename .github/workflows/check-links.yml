# Prüft wöchentlich, ob die URLs im Quellenverzeichnis noch erreichbar sind.
# Defekte Links werden in einem Issue gesammelt (bestehendes Issue wird
# aktualisiert statt dupliziert).

name: Check source links

on:
  schedule:
    - cron: "0 6 * * 1" # Montag 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Viele Shops blockieren Bots (403) oder drosseln (429) – nicht als defekt werten
          args: >-
            --no-progress
            --max-retries 3
            --accept '200..=299,403,429'
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
            'docs/**/*.bib'
            'docs/**/*.typ'
          output: lychee-report.md
          fail: false

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Defekte Links im Quellenverzeichnis"
        run: |
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body-file lychee-report.md
          else
            gh issue create --title "$TITLE" --body-file lychee-report.md
          fi
